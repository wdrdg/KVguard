[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-safety"
version = "0.1.0"
description = "Streaming harmfulness detection from KV-cache running means vs hidden states (minimal controlled experiment)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
  "transformers>=4.56",
  "accelerate",
  "huggingface_hub",
  "safetensors",
  "numpy",
  "scikit-learn",
  "pandas",
  "pyarrow",
  "PyYAML",
  "pytest",
  "tqdm",
  "matplotlib",
  "datasets",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires CUDA and the locally downloaded Qwen/Qwen3-4B checkpoint",
]
