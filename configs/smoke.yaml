# Smoke suite: proves the pipeline runs. Numbers are not evidence of detection quality.
run_name: smoke
allow_test_eval: false
artifacts_dir: artifacts/smoke
resource_manifest: artifacts/resource_manifest.json
hf_cache_dir: null
offline: true
wandb:
  project: kvguard
  entity: null
  enabled: false

model:
  id: Qwen/Qwen3-4B
  revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  layer_index: 23
  enable_thinking: false
  expected_config:
    num_hidden_layers: 36
    hidden_size: 2560
    num_key_value_heads: 8
    head_dim: 128

data:
  construction: smoke_from_train
  fineharm:
    repo_id: liyang-ict/FineHarm
    revision: null
    files: {train: FineHarm-train.json, val: FineHarm-val.json, test: FineHarm-test.json}
  qwen3guardtest:
    repo_id: Qwen/Qwen3GuardTest
    revision: null
    enabled_for_eval: false
  max_length: 2048
  sentence_joiner: "\n"
  split_priority: [test, val, train]
  budgets: {train: 32, dev: 16, calibration: 16}
  sample_seed: 2026

features:
  matrix:
    - {layer: 23, features: [h_last, h_mean, k_mean, v_mean, kv_mean]}
    - {layer: 11, features: [h_mean, v_mean, kv_mean]}
    - {layer: 35, features: [h_mean, v_mean, kv_mean]}
  chunk_size: 128
  max_train_positions: 32
  priority_after_end: 32
  shard_size: 256

classifier:
  hidden: 128
  matched:
    enabled: false
    name: kv_mean_matched
    base_feature: kv_mean
    layer: 23
    hidden: 160

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  max_epochs: 2
  patience: 3
  seeds: [17]
  device: auto

evaluate:
  target_fpr: 0.05
  recall_windows: [32, 128]
  bootstrap_samples: 200
  bootstrap_seed: 0

benchmark:
  suite: smoke
  layer: 23
  seed: 17
  methods: [baseline_no_detector, h_last, h_mean, k_mean, v_mean, kv_mean]
  capacity_control_methods: []
  batch_sizes: [1]
  prompt_tokens: 128
  response_tokens: [64]
  repeats: 1
  warmup_response_tokens: 16
  output_suffix: ""
