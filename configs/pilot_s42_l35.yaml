# Last-layer KV cache only. Same sample budget, seed 42, and 20 epochs as pilot_s42.
run_name: pilot_s42_l35
artifacts_dir: artifacts/pilot_s42_l35
resource_manifest: artifacts/resource_manifest.json
hf_cache_dir: null                      # null -> HF default (HF_HOME / ~/.cache/huggingface)
offline: false                          # true -> HF_HUB_OFFLINE, only pinned local revisions
wandb:
  project: kvguard
  entity: null
  enabled: false

model:
  id: Qwen/Qwen3-4B
  revision: null                        # null -> commit SHA pinned in resource_manifest.json
  dtype: bfloat16
  attn_implementation: sdpa
  layer_index: 35                       # 0-based; the 36th decoder block, the last layer
  enable_thinking: false
  expected_config:
    num_hidden_layers: 36
    hidden_size: 2560
    num_key_value_heads: 8
    head_dim: 128

data:
  fineharm:
    repo_id: liyang-ict/FineHarm
    revision: null
    files: {train: FineHarm-train.json, val: FineHarm-val.json, test: FineHarm-test.json}
  qwen3guardtest:
    repo_id: Qwen/Qwen3GuardTest
    revision: null
    enabled_for_eval: false             # downloaded + audited only in this phase
  max_length: 2048                      # template + prompt + full response tokens
  sentence_joiner: "\n"                 # only used when no trustworthy full response field exists
  split_priority: [test, val, train]    # leaked prompt groups are kept in the earliest listed split
  budgets: {train: 5000, val: 1000, test: 2000}
  sample_seed: 2026

features:
  types: [k_mean, v_mean, kv_mean]
  chunk_size: 128
  max_train_positions: 32
  priority_after_end: 32                # keep b+32 when available
  eval_dtype: float32                   # val/test store every response position
  shard_size: 256                       # responses per .npz shard

classifier:
  hidden: 128
  matched:                              # parameter-count control, not a main comparison
    enabled: false
    name: kv_mean_matched
    base_feature: kv_mean
    hidden: 160

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  max_epochs: 20
  patience: 20
  seeds: [42]
  device: auto

evaluate:
  target_fpr: 0.05
  recall_windows: [32, 128]
  bootstrap_samples: 1000
  bootstrap_seed: 0
  length_bins: [0, 128, 256, 512, 1024, 2048]

benchmark:
  suite: pilot
  methods: [baseline_no_detector, k_mean, v_mean, kv_mean]
  batch_sizes: [1]
  prompt_tokens: 128
  response_tokens: [512, 2048]
  repeats: 3
  warmup_response_tokens: 16
  output_suffix: ""                     # metrics/memory_latency_{raw,summary}<suffix>.csv
