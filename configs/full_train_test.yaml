# Full official FineHarm train, layer 11 only: k_mean, v_mean, kv_mean.
# Official test is scored only after protocol_lock.json. Pilot stays untouched.
run_name: full_train_test
allow_test_eval: true
artifacts_dir: artifacts/full_train_test
resource_manifest: artifacts/resource_manifest.json
hf_cache_dir: null
offline: true
wandb:
  project: kvguard
  entity: null
  enabled: false

model:
  id: Qwen/Qwen3-4B
  revision: null
  dtype: bfloat16
  attn_implementation: sdpa
  layer_index: 11
  enable_thinking: false
  expected_config:
    num_hidden_layers: 36
    hidden_size: 2560
    num_key_value_heads: 8
    head_dim: 128

data:
  construction: full_official
  pilot_split_manifest: artifacts/pilot/split_manifest.jsonl
  fineharm:
    repo_id: liyang-ict/FineHarm
    revision: null
    files: {train: FineHarm-train.json, val: FineHarm-val.json, test: FineHarm-test.json}
  qwen3guardtest:
    repo_id: Qwen/Qwen3GuardTest
    revision: null
    enabled_for_eval: false
  max_length: null
  context_limit: 40960
  sentence_joiner: "\n"
  split_priority: [test, val, train]
  budgets: {train: null, dev: null}
  sample_seed: 2026

features:
  matrix:
    - {layer: 11, features: [k_mean, v_mean, kv_mean]}
  chunk_size: 128
  max_train_positions: 32
  priority_after_end: 32
  shard_size: 256

classifier:
  hidden: 128
  matched:
    enabled: false
    name: kv_mean_matched
    base_feature: kv_mean
    layer: 11
    hidden: 160

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 512
  max_epochs: 20
  patience: 3
  seeds: [17, 42, 2026]
  device: auto

evaluate:
  target_fpr: 0.05
  recall_windows: [32, 128]
  bootstrap_samples: 1000
  bootstrap_seed: 0

benchmark:
  suite: workshop
  layer: 11
  seed: 42
  methods: [baseline_no_detector, k_mean, v_mean, kv_mean]
  capacity_control_methods: []
  batch_sizes: [1]
  prompt_tokens: 128
  response_tokens: [512, 2048]
  repeats: 5
  warmup_response_tokens: 16
  output_suffix: ""
